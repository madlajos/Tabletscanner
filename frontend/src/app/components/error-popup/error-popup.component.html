<div class="error-popup" [ngClass]="severity" [attr.role]="severity === 'error' ? 'alert' : 'status'">
    <p>{{ message }}</p>
    <button type="button" class="error-close" aria-label="Bezárás" (click)="dismiss()">×</button>
    <div
      *ngIf="severity === 'warning'"
      class="warning-timer"
      [style.animation-duration.ms]="warningDurationMs"
      aria-hidden="true"
    ></div>
  </div>
