<nav class="app-nav">
  <button
    class="nav-tab"
    [class.active]="activeSection === 'scanner'"
    (click)="switchSection('scanner')"
  >
    Szkenner
  </button>
  <button
    class="nav-tab"
    [class.active]="activeSection === 'creator'"
    (click)="switchSection('creator')"
  >
    Recept szerkesztő
  </button>
  <button
    class="nav-tab"
    [class.active]="activeSection === 'applier'"
    (click)="switchSection('applier')"
  >
    Recept alkalmazás
  </button>
</nav>

@if (activeSection === 'scanner') {
  <main class="app-grid">
    <!-- Left column (1/5): Camera Settings -->
    <section class="panel scanner-panel">
      <div class="side-section-header side-section-header-subtle">
        <span class="side-section-title">Vezérlőpult</span>
      </div>
      <app-motion-control></app-motion-control>

      <div class="side-section-header side-section-header-subtle settings-section-header">
        <span class="side-section-title">Beállítások</span>
      </div>
      <div class="settings-scroll-region">
        <app-camera-control></app-camera-control>
      </div>

      <button type="button" class="software-settings-button" (click)="openSoftwareSettings()">
        <mat-icon>settings</mat-icon>
        <span>Beállítások</span>
      </button>

      <div class="side-panel-logo">
        <img src="assets/logo.png" alt="Logo" />
      </div>
    </section>

    <!-- Middle column (3/5): Live view -->
    <section class="viewer">
      <app-image-viewer></app-image-viewer>
    </section>

    <!-- Right column (1/5): Controls -->
    <section class="controls-panel">
      <div class="side-panel">

        <div class="side-panel-content">
          <div class="side-section-header side-section-header-subtle">
            <span class="side-section-title">Automata mérés</span>
          </div>
          <app-auto-measurement></app-auto-measurement>
        </div>
        <app-error-popup-list></app-error-popup-list>
      </div>
    </section>
  </main>
}

@if (activeSection === 'creator') {
  <main class="section-container">
    <app-recipe-creator></app-recipe-creator>
  </main>
}

@if (activeSection === 'applier') {
  <main class="section-container">
    <app-recipe-applier></app-recipe-applier>
  </main>
}

@if (softwareSettingsOpen) {
  <app-software-settings (close)="closeSoftwareSettings()"></app-software-settings>
}
