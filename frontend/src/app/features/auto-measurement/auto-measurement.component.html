<div class="auto-measurement">
  <div class="measurement-destination-row">
    <!-- MEASUREMENT NAME -->
    <div class="measurement-name-row">
    <label for="measurementName">Mérés neve</label>
    <input
      id="measurementName"
      type="text"
      class="styled-input measurement-name-input"
      [(ngModel)]="measurementName"
      [disabled]="measurementActive"
      placeholder="Adja meg a mérés nevét..."
    />
    </div>

    <!-- SAVE DIRECTORY -->
    <div class="save-location-row">
    <label for="saveLocation">Mentési hely</label>
    <div class="save-location-input-group">
      <input
        id="saveLocation"
        type="text"
        class="styled-input save-location-input"
        [(ngModel)]="saveLocation"
        [disabled]="measurementActive"
        placeholder="Válasszon mappát..."
        readonly
      />
      <button
        type="button"
        class="browse-button"
        (click)="selectSaveFolder()"
        [disabled]="measurementActive"
        aria-label="Mentési hely kiválasztása"
      >
        ...
      </button>
    </div>
    </div>
  </div>

  <section class="capture-plan-section">
    <div class="capture-plan-header">
      <h4>Automata mérési terv</h4>
      <button
        type="button"
        class="clear-button clear-capture-plan"
        (click)="clearCapturePlan()"
        [disabled]="measurementActive || capturePlan.length <= 1"
      >
        Összes törlése
      </button>
    </div>
    <div #capturePlanScroll class="capture-plan-scroll">
      <table class="capture-plan-table">
        <thead>
          <tr>
            <th class="wavelength-column">Fény</th>
            <th class="filter-column">Szűrő</th>
            <th class="exposure-column">Záridő</th>
            <th class="gain-column">Erősítés</th>
            <th class="action-column" aria-label="Műveletek"></th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let row of capturePlan; let index = index; trackBy: trackCapturePlanRow"
            [attr.data-plan-row-index]="index"
            [class.active-plan-row]="measurementActive && activePlanRowIndex === index">
            <td class="wavelength-column">
              <select [ngModel]="getLightSelectionValue(row)"
                (ngModelChange)="onLightSelectionChanged(row, $event)"
                [disabled]="measurementActive || index === 0"
                [attr.aria-label]="index === 0 ? 'Autofókusz referenciafény: ' + getLightSelectionLabel(row) : 'Mérési fény és fényerő'">
                <option *ngFor="let option of lightOptions" [ngValue]="option.value">{{ option.label }}</option>
              </select>
            </td>
            <td class="filter-column">
              <select [ngModel]="row.filter_position" (ngModelChange)="onFilterSelectionChanged(row, $event)"
                [disabled]="measurementActive || index === 0"
                [attr.aria-label]="index === 0 ? 'Autofókusz referenciaszűrő: ' + getFilterSlotLabel(row.filter_position) : 'Mérési szűrő'">
                <option *ngFor="let filter of filterOptions" [ngValue]="filter">{{ getFilterSlotLabel(filter) }}</option>
              </select>
            </td>
            <td class="exposure-column">
              <div class="number-input-with-unit">
              <input type="text" inputmode="decimal" [ngModel]="row.exposure_time_text"
                (ngModelChange)="onCaptureNumberInput(row, 'exposure_time', $event)"
                (keydown)="blockInvalidNumberKey($event)"
                (paste)="blockInvalidNumberPaste($event)"
                (blur)="onCaptureNumberBlur(row)"
                [class.invalid]="!isExposureValid(row)"
                [disabled]="measurementActive"
                [title]="exposureRange ? exposureRange.min + '–' + exposureRange.max + ' µs' : 'Pozitív szám, µs'"
                aria-label="Záridő mikroszekundumban" />
                <span class="input-unit" aria-hidden="true">µs</span>
              </div>
            </td>
            <td class="gain-column">
              <input type="text" inputmode="decimal" [ngModel]="row.gain_text"
                (ngModelChange)="onCaptureNumberInput(row, 'gain', $event)"
                (keydown)="blockInvalidNumberKey($event)"
                (paste)="blockInvalidNumberPaste($event)"
                (blur)="onGainBlur(row)"
                [class.invalid]="!isGainValid(row)"
                [disabled]="measurementActive"
                [title]="gainRange ? gainRange.min + '–' + gainRange.max + (gainRange.inc > 0 ? ', lépés: ' + gainRange.inc : ', folyamatos') : 'Nemnegatív szám'"
                aria-label="Erősítés" />
            </td>
            <td class="action-column">
              <button type="button" class="delete-capture-row" (click)="removeCapturePlanRow(index)"
                [disabled]="measurementActive || index === 0" [attr.aria-label]="'Mérési sor ' + (index + 1) + ' törlése'">
                ×
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <button type="button" class="add-capture-row" (click)="addCapturePlanRow()" [disabled]="measurementActive">
      +
    </button>
  </section>

  <!-- COMPACT MEASUREMENT OPTIONS -->
  <div class="measurement-options" role="group" aria-label="Automata mérés beállításai">
    <span class="measurement-options-label">Beállítások</span>
    <button
      type="button"
      class="toggle-button"
      [class.active]="autofocus"
      (click)="autofocus = !autofocus"
      [disabled]="measurementActive"
      [attr.aria-pressed]="autofocus"
    >
      <img src="assets/SVG/auto_focus.svg" alt="" />
      <span class="toggle-label">Autofocus</span>
    </button>

    <button
      type="button"
      class="toggle-button"
      [class.active]="backgroundSubtraction"
      (click)="backgroundSubtraction = !backgroundSubtraction"
      [disabled]="measurementActive"
      [attr.aria-pressed]="backgroundSubtraction"
    >
      <img src="assets/SVG/bkgrndsub.svg" alt="" />
      <span class="toggle-label">Háttérlevonás</span>
    </button>
  </div>

  <app-analysis-recipe-selector
    [disabled]="measurementActive"
    (recipeSelected)="onAnalysisRecipeSelected($event)"
  ></app-analysis-recipe-selector>

  <!-- SELECTION HEADER: COUNT + CLEAR BUTTON -->
  <div class="selection-header">
    <div class="selection-count">
      Kijelölt tabletták száma:
      <span class="count">{{ selectedCount }}</span>
    </div>

    <button
      type="button"
      class="clear-button"
      (click)="clearSelection()"
      [disabled]="!hasSelection() || measurementActive"
    >
      Kijelölés törlése
    </button>
  </div>

  <!-- DOT GRID -->
  <div class="tablet-grid" (mouseleave)="onGridMouseLeave()" (click)="hideTabletContextMenu()">
    <div class="toolhead-position-area">
      <app-toolhead-position></app-toolhead-position>
    </div>
    <div
      *ngFor="let id of tablets"
      class="tablet-dot"
      [class.selected]="isDotSelected(id)"
      [class.completed]="isDotCompleted(id)"
      [class.failed]="isDotFailed(id)"
      [class.in-progress]="isDotInProgress(id)"
      [class.pending]="getDotState(id) === 'pending' && measurementActive"
      (click)="onDotClick(id)"
      (contextmenu)="onTabletContextMenu($event, id)"
      (mouseenter)="onDotMouseEnter(id)"
      [title]="getTabletTooltip(id)"
    >
      <span class="tablet-number">{{ getTabletLabel(id) }}</span>
    </div>
  </div>

  @if (tabletContextMenuVisible) {
    <div class="context-menu tablet-context-menu" 
         [style.left.px]="tabletContextMenuX"
         [style.top.px]="tabletContextMenuY"
         (mouseleave)="hideTabletContextMenu()">
      <div class="context-menu-item" (click)="selectTablet()">
        <span>Kiválaszt</span>
      </div>
      <div class="context-menu-item" 
           [class.disabled]="!tabletHomed"
           [title]="tabletHomed ? '' : 'Mozgásplatform nincs homing-olva'"
           (click)="tabletHomed && moveToTablet()"
           (mousedown)="$event.preventDefault()"
           (mouseup)="$event.preventDefault()">
        <span>Mozgás ide</span>
      </div>
    </div>
  }

  <!-- START / STOP BUTTON FULL WIDTH -->
  <button
    class="start-button"
    [ngClass]="{ stop: measurementActive }"
    (click)="startMeasurement()"
    [disabled]="!canStart()"
  >
    <span class="start-button-primary">{{ measurementButtonPrimary }}</span>
    <span class="start-button-detail" *ngIf="measurementButtonDetail">{{ measurementButtonDetail }}</span>
  </button>
  <app-error-popup-list class="measurement-notifications"></app-error-popup-list>
</div>
