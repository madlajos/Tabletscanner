<div class="camera-settings-container">

  <!-- User Settings -->
  <section class="user-settings">
    <button type="button" class="section-toggle" (click)="toggleSaveSettings()"
      [attr.aria-expanded]="saveSettingsExpanded" aria-controls="save-settings-content">
      <span>Mentési Beállítások</span>
      <mat-icon>{{ saveSettingsExpanded ? 'expand_less' : 'expand_more' }}</mat-icon>
    </button>
    <table id="save-settings-content" class="user-settings-table" [hidden]="!saveSettingsExpanded">
      <tbody>
        <!-- Top row: Objektív -->
        <tr>
          <td>Objektív</td>
          <td>
            <select [(ngModel)]="otherSettings['objective']" (change)="applyOtherSetting('objective')"
              class="styled-input" [disabled]="measurementActive || isAutofocusing">
              <option value="0.5x">0.5x</option>
              <option value="1.0x">1.0x</option>
            </select>
          </td>
          <td></td>
        </tr>

        <!-- Second row: Közgyűrűk -->
        <tr>
          <td>Közgyűrűk</td>
          <td>
            <select [(ngModel)]="otherSettings['spacer_rings']" (change)="applyOtherSetting('spacer_rings')"
              class="styled-input" [disabled]="measurementActive || isAutofocusing">
              <option value="0">0</option>
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
            </select>
          </td>
          <td></td>
        </tr>

        <!-- Third row: Háttérlevonás -->
        <tr>
          <td>Háttérlevonás</td>
          <td class="checkbox-cell">
            <div class="checkbox-wrapper">
              <input
                type="checkbox"
                class="styled-checkbox"
                [(ngModel)]="otherSettings['background_subtraction']"
                (change)="applyOtherSetting('background_subtraction')"
                [disabled]="measurementActive || isAutofocusing"
              />
            </div>
          </td>
          <td></td>
        </tr>

        <!-- Camera settings file (.pfs) -->


        <!-- Save location (folder for images) -->
        <tr>
          <td>Mentés helye</td>
          <td colspan="2" class="csv-dir-cell">
            <div class="csv-input-wrapper wide-input-wrapper">

              <input type="text" class="styled-input dir-display" [(ngModel)]="otherSettings['save_location']"
                (blur)="applyOtherSetting('save_location')" [disabled]="measurementActive || isAutofocusing" readonly />

              <button type="button" (click)="openImageFolderBrowser()" [disabled]="measurementActive || isAutofocusing"
                class="browse-button">...
              </button>

            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </section>

  <!-- Developer Settings -->
  <section class="developer-settings">
    <button type="button" class="section-toggle" (click)="toggleCameraSettings()"
      [attr.aria-expanded]="cameraSettingsExpanded" aria-controls="camera-settings-content">
      <span>Kamerabeállítások</span>
      <mat-icon>{{ cameraSettingsExpanded ? 'expand_less' : 'expand_more' }}</mat-icon>
    </button>

    <table id="camera-settings-content" class="camera-settings-table" [hidden]="!cameraSettingsExpanded">
      <tbody>
        <tr>
          <td>Záridő</td>
          <td>
            <input type="number" inputmode="numeric"
              [step]="cameraRange('ExposureTime')?.inc || 1"
              [min]="cameraRange('ExposureTime')?.min ?? 0"
              [max]="cameraRange('ExposureTime')?.max ?? null"
              [(ngModel)]="cameraSettings.ExposureTime"
              (focus)="handleNumericFocus('ExposureTime', 0)"
              (blur)="handleNumericBlur('ExposureTime', 0)"
              [disabled]="!isConnected || measurementActive || isAutofocusing">
          </td>
        </tr>

        <tr>
          <td>Erősítés</td>
          <td>
            <input type="number" inputmode="decimal"
              [step]="cameraRange('Gain')?.inc || 'any'"
              [min]="cameraRange('Gain')?.min ?? 0"
              [max]="cameraRange('Gain')?.max ?? null"
              [(ngModel)]="cameraSettings.Gain"
              (focus)="handleNumericFocus('Gain', 6)"
              (blur)="handleNumericBlur('Gain', 6)"
              [disabled]="!isConnected || !cameraRange('Gain') || measurementActive || isAutofocusing">
          </td>
        </tr>

        <tr>
          <td>Gamma</td>
          <td>
            <input type="number" inputmode="decimal"
              [step]="cameraRange('Gamma')?.inc || 'any'"
              [min]="cameraRange('Gamma')?.min ?? 0"
              [max]="cameraRange('Gamma')?.max ?? null"
              [(ngModel)]="cameraSettings.Gamma"
              (focus)="handleNumericFocus('Gamma', 4)"
              (blur)="handleNumericBlur('Gamma', 4)"
              [disabled]="!isConnected || measurementActive || isAutofocusing">
          </td>
        </tr>



        <tr>
          <td>Kamera Profil</td>
          <td colspan="2">
            <div class="csv-input-wrapper wide-input-wrapper preset-wrapper">


              <input type="text" class="styled-input dir-display" [(ngModel)]="otherSettings['camera_settings_file']"
                (blur)="applyOtherSetting('camera_settings_file')" [disabled]="measurementActive || isAutofocusing" readonly />

              <button class="browse-button" (click)="openCameraFileBrowser()" [disabled]="measurementActive || isAutofocusing">...
              </button>

            </div>
          </td>
        </tr>

        <!-- Controls row spanning the whole width -->
        <tr>
          <td colspan="3">
            <div class="button-group">
              <button type="button" (click)="toggleConnection()"
                [ngClass]="{ 'connect-button': true, 'connected': isConnected }"
                [disabled]="measurementActive || isAutofocusing">
                <mat-icon *ngIf="isConnected; else connectIcon">link_off</mat-icon>
                <ng-template #connectIcon><mat-icon>link</mat-icon></ng-template>
              </button>

              <button type="button" (click)="toggleStream()"
                [ngClass]="{ 'stream-button': true, 'streaming': isStreaming }" [disabled]="!isConnected || measurementActive || isAutofocusing">
                <mat-icon *ngIf="isStreaming; else playIcon">stop</mat-icon>
                <ng-template #playIcon><mat-icon>play_arrow</mat-icon></ng-template>
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </section>
</div>
