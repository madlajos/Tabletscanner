<div class="control-panel" [class.locked]="measurementActive || isAutofocusing">
  <h3 class="control-subsection-title control-subsection-title-first" id="table-control-title">Asztalvezérlés</h3>
  <div class="position-display" aria-labelledby="table-control-title">
    <div class="position">
      <div class="position-container">
        <div class="coord-input-wrapper">
          <span class="coord-prefix">X</span>
          <input id="x-position" class="coord-input" type="text" inputmode="decimal" [(ngModel)]="xPosition"
            [disabled]="motorOffState || !isConnected || !xHomed || measurementActive || isAutofocusing" [attr.placeholder]="xHomed ? '' : '?'"
            (focus)="onFocus('x')" (blur)="onBlur('x')" (keyup.enter)="submitOnEnter('x')" />
        </div>
      </div>
    </div>

    <div class="position">
      <div class="position-container">
        <div class="coord-input-wrapper">
          <span class="coord-prefix">Y</span>
          <input id="y-position" class="coord-input" type="text" inputmode="decimal" [(ngModel)]="yPosition"
            [disabled]="motorOffState || !isConnected || !yHomed || measurementActive || isAutofocusing" [attr.placeholder]="yHomed ? '' : '?'"
            (focus)="onFocus('y')" (blur)="onBlur('y')" (keyup.enter)="submitOnEnter('y')" />
        </div>
      </div>
    </div>

    <div class="position">
      <div class="position-container">
        <div class="coord-input-wrapper">
          <span class="coord-prefix">Z</span>
          <input id="z-position" class="coord-input" type="text" inputmode="decimal" [(ngModel)]="zPosition"
            [disabled]="motorOffState || !isConnected || !zHomed || measurementActive || isAutofocusing" [attr.placeholder]="zHomed ? '' : '?'"
            (focus)="onFocus('z')" (blur)="onBlur('z')" (keyup.enter)="submitOnEnter('z')" />
        </div>
      </div>
    </div>
  </div>


  <div class="controls-container">
    <div class="movement-buttons">
      <!-- -X -->
      <button class="direction-button rotate-up" 
        (click)="moveToolHeadRelative('x', -movementAmount)"
        [disabled]="controlsDisabled || !(xHomed && yHomed && zHomed)">
        <img src="assets/SVG/arrow.svg" alt="Move X-" class="direction-icon" />
      </button>

      <div class="movement-column">
        <!-- +Y -->
        <button class="direction-button rotate-right" 
          (click)="moveToolHeadRelative('y', movementAmount)"
          [disabled]="controlsDisabled || !(xHomed && yHomed && zHomed)">
          <img src="assets/SVG/arrow.svg" alt="Move Y+" class="direction-icon" />
        </button>
        <div class="gap"></div>
        <!-- -Y -->
        <button class="direction-button rotate-left" 
          (click)="moveToolHeadRelative('y', -movementAmount)"
          [disabled]="controlsDisabled || !(xHomed && yHomed && zHomed)">
          <img src="assets/SVG/arrow.svg" alt="Move Y-" class="direction-icon" />
        </button>
      </div>

      <!-- +X -->
      <button class="direction-button rotate-down" 
        (click)="moveToolHeadRelative('x', movementAmount)"
        [disabled]="controlsDisabled || !(xHomed && yHomed && zHomed)">
        <img src="assets/SVG/arrow.svg" alt="Move X+" class="direction-icon" />
      </button>

      <div class="movement-column">
        <!-- +Z -->
        <button class="direction-button rotate-right" 
          (click)="moveToolHeadRelative('z', movementAmount)"
          [disabled]="controlsDisabled || !(xHomed && yHomed && zHomed)">
          <img src="assets/SVG/arrow.svg" alt="Move Z+" class="direction-icon" />
        </button>
        <div class="gap"></div>
        <!-- -Z -->
        <button class="direction-button rotate-left" 
          (click)="moveToolHeadRelative('z', -movementAmount)"
          [disabled]="controlsDisabled || !(xHomed && yHomed && zHomed)">
          <img src="assets/SVG/arrow.svg" alt="Move Z-" class="direction-icon" />
        </button>
      </div>
    </div>

    <div class="home-buttons-grid">
      <!-- Home (Z → Y → X) -->
      <button class="home-button" 
        (click)="homeAllAxesInOrder()" 
        [class.homing]="isHoming"
        [class.homed]="xHomed && yHomed && zHomed"
        [disabled]="isHoming || !isConnected || measurementActive || isAutofocusing">
        <img src="assets/SVG/home.svg" alt="Home" class="home-icon" />
      </button>

      <!-- Autofocus (click again while running to abort) -->
      <button class="home-button" 
        (click)="autoFocusCoarse()" 
        [class.autofocusing]="isAutofocusing"
        [class.autofocused]="autofocusDone"
        [disabled]="!isConnected || measurementActive || !(xHomed && yHomed && zHomed)">
        <img src="assets/SVG/auto_focus.svg" alt="Autofocus" class="home-icon" />
      </button>

      <!-- First tablet position -->
      <button class="home-button" 
        (click)="moveToolHeadAbsolute(2.9, 10.6, 20)"
        [disabled]="controlsDisabled || !(xHomed && yHomed && zHomed)">
        <img src="assets/SVG/first_tablet_pos.svg" alt="First tablet position" class="home-icon" />
      </button>

      <!-- Service position -->
      <button class="home-button"
        (click)="moveToolHeadAbsolute(86, 20, 0)"
        [disabled]="controlsDisabled || !(xHomed && yHomed && zHomed)">
        <img src="assets/SVG/service_pos.svg" alt="Service position" class="home-icon" />
      </button>
    </div>
  </div>

  <div class="movement-amount-buttons">
    <button [class.active]="movementAmount === 0.1" (click)="setMovementAmount(0.1)" [disabled]="controlsDisabled || !(xHomed && yHomed && zHomed)">0.1</button>
    <button [class.active]="movementAmount === 1" (click)="setMovementAmount(1)" [disabled]="controlsDisabled || !(xHomed && yHomed && zHomed)">1</button>
    <button [class.active]="movementAmount === 10" (click)="setMovementAmount(10)" [disabled]="controlsDisabled || !(xHomed && yHomed && zHomed)">10</button>
    <!-- Tablet step: selects 18.3 mm as movementAmount -->
    <button class="tablet-step-button" [class.active]="movementAmount === 18.3" (click)="setMovementAmount(18.3)" [disabled]="controlsDisabled || !(xHomed && yHomed && zHomed)">
      <img src="assets/SVG/tablet.svg" alt="Tablet step 18.3 mm" class="tablet-icon" />
    </button>
    <button [class.active]="movementAmount === 25" (click)="setMovementAmount(25)" [disabled]="controlsDisabled || !(xHomed && yHomed && zHomed)">25</button>
    <button [class.active]="movementAmount === 50" (click)="setMovementAmount(50)" [disabled]="controlsDisabled || !(xHomed && yHomed && zHomed)">50</button>
    <button [class.active]="movementAmount === 100" (click)="setMovementAmount(100)" [disabled]="controlsDisabled || !(xHomed && yHomed && zHomed)">100</button>
  </div>

  <h3 class="control-subsection-title" id="lamp-control-title">Lámpavezérlés</h3>
  <div class="lamp-buttons" aria-labelledby="lamp-control-title">
    <button *ngFor="let lamp of lampButtons" class="lamp-button" [class.active]="isLampActive(lamp.channel)"
      (click)="onLampClick(lamp.channel)" (dblclick)="onLampDoubleClick(lamp.channel)"
      [disabled]="!isConnected || measurementActive || isAutofocusing"
      [attr.aria-label]="lamp.label + ' lámpa'">
      <img [src]="lampAsset(lamp)" [alt]="lamp.label" class="lamp-icon" />
      <span class="brightness-indicator" aria-hidden="true"
        [class.vis-indicator]="lamp.channel === 'vis'"
        [class.dimmed]="isLampActive(lamp.channel) && lightStatus.active_mode === 'dimmed'"
        [class.full]="isLampActive(lamp.channel) && (lightStatus.active_mode === 'full' || lamp.channel === 'vis')">
        <span class="brightness-segment upper"></span>
        <span class="brightness-segment lower"></span>
      </span>
    </button>
  </div>

  <section class="filter-revolver-control" aria-labelledby="filter-revolver-control-title">
    <h3 class="control-subsection-title" id="filter-revolver-control-title">Szűrőváltó</h3>
    <div class="filter-revolver-control-content">
      <app-filter-revolver
        [settings]="filterSettings"
        [activePosition]="filterRevolverStatus.position"
        [rotationDegrees]="filterRevolverRotationDegrees"
        [interactive]="!filterRevolverControlsDisabled"
        (positionActivate)="activateFilterPosition($event)"
        [size]="150"
      ></app-filter-revolver>

      <div class="filter-revolver-info">
        <table class="active-filter-details" aria-label="Aktív szűrő adatai">
          <tbody>
            <tr><th>Név:</th><td>{{ activeFilter?.name || 'Üres' }}</td></tr>
            <tr><th>λ:</th><td>{{ activeFilter ? activeFilter.wavelength_range + ' nm' : '—' }}</td></tr>
            <tr><th>ΔZ:</th><td>{{ activeFilter ? activeFilter.height_offset_mm + ' mm' : '—' }}</td></tr>
          </tbody>
        </table>

        <div class="filter-revolver-buttons" aria-label="Szűrőváltó forgatása">
          <button
            type="button"
            class="direction-button rotate-down"
            (click)="rotateFilterRevolver('down')"
            [disabled]="filterRevolverControlsDisabled"
            aria-label="Szűrőváltó a következő, nagyobb számú pozícióra"
          >
            <img src="assets/SVG/arrow.svg" alt="" class="direction-icon" />
          </button>
          <button
            type="button"
            class="direction-button rotate-up"
            (click)="rotateFilterRevolver('up')"
            [disabled]="filterRevolverControlsDisabled"
            aria-label="Szűrőváltó az előző, kisebb számú pozícióra"
          >
            <img src="assets/SVG/arrow.svg" alt="" class="direction-icon" />
          </button>
        </div>
      </div>
    </div>
    <p class="filter-revolver-note" *ngIf="isConnected && (!filterRevolverStatus.homed || !filterRevolverStatus.motion_platform_homed)">
      A szűrőváltó a mozgásplatform homingja után vezérelhető.
    </p>
  </section>
</div>
